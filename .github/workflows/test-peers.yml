name: Test Peers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/v3-**']

jobs:
  typeorm:
    name: TypeORM ${{ matrix.typeorm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typeorm: ['0.3.26', '0.3.27', 'latest']
        # 1.x entra quando a linha estabilizar (spec §6.1).
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -w -D typeorm@${{ matrix.typeorm }}
      - run: pnpm test

  nestjs:
    name: NestJS ${{ matrix.nestjs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A 12 é ESM-only e está fora do peer declarado (`^11.0.0`); entra
        # quando tiver suíte própria, como manda o spec §6.1.
        nestjs: ['11.0.0', '11.x']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm add -w -D \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }}
      - run: pnpm test

  # A linha 0.45 do Drizzle é peer suportado (`^0.45.0`) e o devDependency do
  # repo fica no 1.x, que é o único com driver de SQL Server. Este job troca o
  # Drizzle pela 0.45 e roda o corpus de referência e o typecheck dos testes:
  # é o que impede um uso de API exclusivo do 1.x de entrar no adapter calado.
  # As células reais da 0.45 rodam no `database-matrix`.
  drizzle:
    name: Drizzle ${{ matrix.drizzle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drizzle: ['0.45.4']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -w -D drizzle-orm@${{ matrix.drizzle }}
      - run: pnpm typecheck
      - run: pnpm typecheck:tests
      - run: pnpm test
