name: Test Peers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/v3-**']

# O job do Drizzle sai daqui até a fase 5 da v3: sem adapter Drizzle, ele
# ficaria verde sem exercitar nada e sugeriria suporte à linha 0.45, que a v3
# explicitamente não tem (o alvo é 1.x).
jobs:
  typeorm:
    name: TypeORM ${{ matrix.typeorm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typeorm: ['0.3.26', '0.3.27', 'latest']
        # 1.x entra quando a linha estabilizar (spec §6.1).
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -w -D typeorm@${{ matrix.typeorm }}
      - run: pnpm test

  nestjs:
    name: NestJS ${{ matrix.nestjs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A 12 é ESM-only e está fora do peer declarado (`^11.0.0`); entra
        # quando tiver suíte própria, como manda o spec §6.1.
        nestjs: ['11.0.0', '11.x']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm add -w -D \
            @nestjs/common@${{ matrix.nestjs }} \
            @nestjs/core@${{ matrix.nestjs }} \
            @nestjs/platform-express@${{ matrix.nestjs }} \
            @nestjs/testing@${{ matrix.nestjs }}
      - run: pnpm test
