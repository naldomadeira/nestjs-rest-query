name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/v3-**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm build

      - if: matrix.node == '24'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/cobertura-coverage.xml
        continue-on-error: true

  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --pack-destination /tmp
      - name: Inspect tarball contents
        run: tar -tzf /tmp/nestjs-rest-query-*.tgz | sort

      - name: Validate package.json (publint)
        run: pnpm dlx publint@latest

      - name: Validate type exports (attw)
        run: pnpm dlx @arethetypeswrong/cli@latest --pack .

      - name: Isolated consumer fixtures (CJS and ESM, no ORM peers)
        run: sh scripts/verify-package.sh
