name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # O token que abre a PR de release decide se ela nasce testável.
      #
      # Com o `GITHUB_TOKEN`, a PR é criada pelo `github-actions[bot]` e os
      # workflows dela ficam em `action_required` esperando aprovação manual.
      # Como `test (22)`, `test (24)` e `pack-check` são checks obrigatórios em
      # `main`, a PR fica `BLOCKED` até alguém entrar no Actions e aprovar —
      # em toda release, e sem nada na interface dizendo por quê.
      #
      # Um `RELEASE_PAT` evita isso: a PR nasce como o usuário e dispara CI
      # sozinha. **Não é a configuração recomendada**, e o secret não existe: um
      # PAT com escrita reintroduz a credencial de longa duração que o Trusted
      # Publishing foi adotado para eliminar, e o que se compra é ~10 segundos
      # por release. Aprovar os runs na aba Actions é a operação normal aqui.
      #
      # Se o volume de releases um dia justificar automatizar, o caminho que
      # mantém a postura é um GitHub App com `actions/create-github-app-token`:
      # token de vida curta, gerado por execução, sem credencial pessoal parada.
      #
      # O `||` existe para que essa decisão seja reversível sem tocar no
      # workflow. Se um PAT for mesmo criado, fine-grained neste repo com
      # `Contents: write` e `Pull requests: write` basta — `workflow` não, porque
      # a PR de release só toca `package.json`, `CHANGELOG.md` e `.changeset/`.
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
