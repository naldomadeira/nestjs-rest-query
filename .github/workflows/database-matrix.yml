name: database-matrix

# Matriz ORM × banco (spec §19). Uma célula vermelha bloqueia o release, e
# skips são proibidos: o gate `assert-no-skips` falha se algum caso do corpus
# não tiver rodado.
#
# O escopo muda com o evento, e é decisão de design, não economia:
#
# - **pull request**: uma célula por ORM, no Postgres, que é o alvo principal
#   da §6.1. Dá diagnóstico rápido sem manter três containers por ORM.
# - **push em `main` e tag**: as nove células. O §6.2 diz que célula vermelha
#   bloqueia *release*, não PR — então é aqui que o gate vale.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: database-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cell:
    name: ${{ matrix.adapter }} / ${{ matrix.dialect }}
    # SQL Server exige runner Linux x64 (spec §19).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [typeorm, prisma, drizzle]
        dialect: ${{ github.event_name == 'pull_request' && fromJSON('["postgres"]') || fromJSON('["postgres","mysql","mssql"]') }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O `provider` do datasource do Prisma tem de ser literal, então existe
      # um schema por dialeto e o client é gerado por célula.
      - name: generate the Prisma client for this cell
        if: matrix.adapter == 'prisma'
        run: pnpm prisma:generate:cell
        env:
          DQB_PRISMA_SCHEMA: ${{ matrix.dialect == 'mssql' && 'sqlserver' || matrix.dialect }}

      - name: start the certified profile
        run: |
          docker compose -f test/profiles/docker-compose.yml up -d --wait ${{ matrix.dialect }}

      - name: apply the SQL Server profile
        if: matrix.dialect == 'mssql'
        # A imagem do SQL Server não roda scripts de init sozinha.
        run: |
          docker compose -f test/profiles/docker-compose.yml exec -T mssql \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Dqb_Str0ng!' -C \
            -i /profile/profile.sql

      - name: run the parity corpus
        run: pnpm test:integration
        env:
          DQB_ADAPTER: ${{ matrix.adapter }}
          DQB_DIALECT: ${{ matrix.dialect }}
          DQB_PG_URL: postgres://dqb:dqb@localhost:55432/dqb
          DQB_MYSQL_URL: mysql://dqb:dqb@localhost:53306/dqb
          DQB_MSSQL_URL: mssql://sa:Dqb_Str0ng!@localhost:51433/dqb
          JEST_JUNIT_OUTPUT_NAME: integration.xml

      - name: fail on skipped cases
        run: node scripts/assert-no-skips.mjs integration.xml

      - name: dump database logs on failure
        if: failure()
        run: docker compose -f test/profiles/docker-compose.yml logs ${{ matrix.dialect }}

      - name: stop the profile
        if: always()
        run: docker compose -f test/profiles/docker-compose.yml down -v

  # Ponto único de required status check.
  #
  # Não verifica nada por si: quem verifica é o `needs: cell`, que só libera
  # este job se **todas** as células da matriz tiverem passado. Existe porque
  # uma matriz dinâmica muda de tamanho entre `pull_request` e `push`, e um
  # required check não pode apontar para um nome de job que varia.
  #
  # Só roda em `push` porque é ali que a matriz é completa: o gate da §23 é
  # "nove combinações reais verdes, sem skips", e o pull request roda três.
  matrix-complete:
    name: matrix complete
    needs: cell
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "todas as células da matriz passaram"
