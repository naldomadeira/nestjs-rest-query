<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">nestjs-rest-query banner</title>
  <desc id="desc">Banner escuro para nestjs-rest-query, destacando query params declarativos, filtros, ordenação, paginação, campos e includes.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B12"/>
      <stop offset="1" stop-color="#0F1423"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 86) rotate(128) scale(540 780)">
      <stop stop-color="#4F7CFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#34D3FF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#34D3FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 100) rotate(54) scale(260 200)">
      <stop stop-color="#4F7CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4F7CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardStroke" x1="40" y1="40" x2="1160" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A3555" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#23304D" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="iconBg" x1="0" y1="0" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F7CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34D3FF" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="accentChip" x1="0" y1="0" x2="210" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F7CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34D3FF" stop-opacity="0.12"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#02040A" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#pageBg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>

  <rect x="40" y="40" width="1120" height="550" rx="32" fill="#0E111B" stroke="url(#cardStroke)" filter="url(#shadow)"/>

  <g opacity="0.22">
    <path d="M900 98C1009 138 1083 211 1106 362" stroke="#4F7CFF" stroke-width="2"/>
    <path d="M846 128C938 171 998 234 1025 355" stroke="#34D3FF" stroke-width="2"/>
    <path d="M800 158C875 197 928 250 951 345" stroke="#8BA5FF" stroke-width="2"/>
  </g>

  <g transform="translate(92 92)">
    <rect width="332" height="42" rx="21" fill="#171C29" stroke="#2B3350"/>
    <text x="28" y="27" fill="#E9EEF9" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">NestJS · TypeORM · Drizzle</text>
  </g>

  <g transform="translate(92 168)">
    <rect width="92" height="92" rx="24" fill="url(#iconBg)" stroke="#4E76FF" stroke-opacity="0.55"/>
    <path d="M22 23H70L53 43V61L38.5 69L38.4 43L22 23Z" stroke="#D8E7FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 34H61" stroke="#D8E7FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M35 45H57" stroke="#D8E7FF" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="204" y="208" fill="#FBFCFF" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="800">nestjs-rest-query</text>
  <text x="204" y="258" fill="#AEB7CC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Declarative REST query params for NestJS APIs.</text>
  <text x="204" y="292" fill="#AEB7CC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Endpoint whitelists with safer parsing and cleaner docs.</text>
  <text x="204" y="326" fill="#AEB7CC" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500">Filters, sorting, pagination, fields, and includes.</text>

  <g transform="translate(92 366)">
    <rect width="210" height="46" rx="23" fill="url(#accentChip)" stroke="#4F7CFF" stroke-opacity="0.46"/>
    <text x="26" y="30" fill="#DCE8FF" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">filters=name,cnpj</text>
  </g>

  <g transform="translate(318 366)">
    <rect width="190" height="46" rx="23" fill="#143142" fill-opacity="0.6" stroke="#34D3FF" stroke-opacity="0.42"/>
    <text x="26" y="30" fill="#D9F8FF" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">sort=-createdAt</text>
  </g>

  <g transform="translate(524 366)">
    <rect width="178" height="46" rx="23" fill="#171B26" stroke="#30384F"/>
    <text x="26" y="30" fill="#E7EBF4" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">include=owner</text>
  </g>

  <g transform="translate(92 426)">
    <rect width="118" height="46" rx="23" fill="#171B26" stroke="#30384F"/>
    <text x="26" y="30" fill="#E7EBF4" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">page=2</text>
  </g>

  <g transform="translate(226 426)">
    <rect width="156" height="46" rx="23" fill="#171B26" stroke="#30384F"/>
    <text x="26" y="30" fill="#E7EBF4" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">perPage=20</text>
  </g>

  <g transform="translate(398 426)">
    <rect width="166" height="46" rx="23" fill="#171B26" stroke="#30384F"/>
    <text x="26" y="30" fill="#E7EBF4" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">fields=id,name</text>
  </g>

  <g transform="translate(718 126)">
    <rect width="396" height="348" rx="26" fill="#0A0D16" stroke="#2A3450"/>
    <rect x="0.5" y="0.5" width="395" height="50" rx="25.5" fill="#131826"/>
    <circle cx="30" cy="26" r="6" fill="#FF7A7A"/>
    <circle cx="52" cy="26" r="6" fill="#FFD66E"/>
    <circle cx="74" cy="26" r="6" fill="#67E8A5"/>
    <text x="102" y="31" fill="#98A3BC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">companies.controller.ts</text>
    <line x1="0" y1="50" x2="396" y2="50" stroke="#212A42"/>

    <text x="28" y="94" fill="#9CDCFE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">@Get()</text>
    <text x="28" y="126" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">@ApiDynamicQuery&lt;Company&gt;({</text>
    <text x="44" y="156" fill="#CE9178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">filters: ['name', 'cnpj'],</text>
    <text x="44" y="184" fill="#CE9178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">sorts: ['name', 'createdAt'],</text>
    <text x="44" y="212" fill="#CE9178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">fields: ['id', 'name'],</text>
    <text x="44" y="240" fill="#CE9178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">includes: ['owner']</text>
    <text x="28" y="270" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">})</text>
    <text x="28" y="312" fill="#4ADE80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">return this.qb.execute(query)</text>
  </g>

  <g transform="translate(810 500)">
    <rect width="226" height="44" rx="22" fill="#163442" fill-opacity="0.74" stroke="#34D3FF" stroke-opacity="0.42"/>
    <text x="28" y="29" fill="#DFFAFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Safe query parsing</text>
  </g>
</svg>
