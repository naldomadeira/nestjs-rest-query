services:
  postgres:
    image: postgres:16-alpine
    container_name: prisma-example-postgres
    environment:
      POSTGRES_DB: app_db_prisma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: prisma-example-postgres-data
